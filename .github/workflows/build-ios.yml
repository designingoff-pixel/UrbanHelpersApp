name: Build iOS IPA — Urban Helpers (AltStore, Free, No Apple Dev Account)

on:
  push:
    branches: [main]
    paths:
      - 'ios_app/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:   # ← Manual trigger button in GitHub Actions UI

jobs:
  build-ios:
    name: 🍎 Build Unsigned IPA (macOS + Xcode + Fastlane)
    runs-on: macos-14          # Apple Silicon Mac runner — free for public repos
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ios_app/package-lock.json

      # ── 3. Ruby + Fastlane ───────────────────────────────────────────────────
      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios_app

      - name: Install Fastlane
        run: gem install fastlane --no-document

      # ── 4. Xcode version ─────────────────────────────────────────────────────
      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # ── 5. Install JS dependencies ────────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: ios_app
        run: npm install --legacy-peer-deps
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyDhkD-wS-wCc2ZlMbHSNTEp3MFxSrLIUQY
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: urban-helpers-admin.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: urban-helpers-admin
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: urban-helpers-admin.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "843343743619"
          EXPO_PUBLIC_FIREBASE_APP_ID: "1:843343743619:web:a0c09ea15fa85780d6a9b6"
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 843343743619-q4jpmh7eouc3kom1kias1hnh1ps4qom8.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 843343743619-u5nmtb1nhbmd6rhoptm6406lisjhna60.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: AIzaSyAMzsDmDdT2c7r5j1dWTSxev6XSHJZTf-s
          EXPO_PUBLIC_USDA_API_KEY: cIZXb3lSBZNqKTYDCAvOUFoaupx8AqkIyBpxqSkM

      # ── 6. CocoaPods cache ────────────────────────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios_app/ios/Pods
          key: pods-${{ hashFiles('ios_app/ios/Podfile.lock') }}
          restore-keys: pods-

      # ── 7. Fastlane build (generates ios/ + builds IPA) ──────────────────────
      - name: Build unsigned IPA via Fastlane
        working-directory: ios_app
        run: fastlane altstore
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyDhkD-wS-wCc2ZlMbHSNTEp3MFxSrLIUQY
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: urban-helpers-admin.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: urban-helpers-admin
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: urban-helpers-admin.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "843343743619"
          EXPO_PUBLIC_FIREBASE_APP_ID: "1:843343743619:web:a0c09ea15fa85780d6a9b6"
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 843343743619-q4jpmh7eouc3kom1kias1hnh1ps4qom8.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 843343743619-u5nmtb1nhbmd6rhoptm6406lisjhna60.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: AIzaSyAMzsDmDdT2c7r5j1dWTSxev6XSHJZTf-s
          EXPO_PUBLIC_USDA_API_KEY: cIZXb3lSBZNqKTYDCAvOUFoaupx8AqkIyBpxqSkM

      # ── 8. Upload IPA as artifact (same as Android APK) ──────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrbanHelpers-iOS-IPA     # ← download this zip from GitHub Actions
          path: ios_app/build/UrbanHelpers.ipa
          if-no-files-found: error
          retention-days: 14

      # ── 9. Summary ───────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "================================================================"
          echo "✅ UrbanHelpers.ipa built successfully!"
          echo ""
          echo "📥 HOW TO INSTALL ON IPHONE (AltStore — FREE):"
          echo ""
          echo "  ONE-TIME SETUP (5 min):"
          echo "  1. On your PC → go to altstore.io → Download AltServer for Windows"
          echo "  2. Install AltServer, run it (sits in system tray)"
          echo "  3. Plug iPhone to PC via USB"
          echo "  4. In AltServer system tray → Install AltStore → pick your iPhone"
          echo "  5. AltStore appears on iPhone — done!"
          echo ""
          echo "  EVERY TIME (installing a new build):"
          echo "  1. Download zip from GitHub Actions artifacts"
          echo "  2. Extract → get UrbanHelpers.ipa"
          echo "  3. Open AltStore on iPhone → My Apps → + button"
          echo "  4. Select UrbanHelpers.ipa → installs in seconds ✅"
          echo "  (No cable needed after setup — works over WiFi)"
          echo "================================================================"
