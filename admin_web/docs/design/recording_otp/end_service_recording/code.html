<style>

        .glow-effect {
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255, 180, 171, 0.15) 0%, rgba(255, 180, 171, 0) 70%);
            border-radius: 50%;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);

        }

            background: linear-gradient(135deg, #ffdad6 0%, #ffb4ab 100%);

        }
        
        .pulse-record {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 180, 171, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 180, 171, 0); }

        }

<script>
        // Simple entrance animation for the modal
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('confirmation-modal');
            if(window.innerWidth < 768) {
                // Bottom sheet behavior on mobile
                modal.classList.add('translate-y-full');
                setTimeout(() => {
                    modal.classList.remove('translate-y-full');
                }, 50);
            } else {
                // Fade/scale on desktop
                modal.classList.add('opacity-0', 'scale-95');
                setTimeout(() => {
                    modal.classList.remove('opacity-0', 'scale-95');
                    modal.classList.add('opacity-100', 'scale-100');
                }, 50);
            }
        });
    </script>
